<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dziennik</title>
    <script>
      // Runs before React so the first paint is already the right theme.
      // Mirrors resolveTheme() in src/lib/theme.ts - keep the two in step.
      try {
        var stored = localStorage.getItem("dziennik-theme");
        var dark =
          stored === "dark" ||
          ((stored === "system" || stored === null) &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
